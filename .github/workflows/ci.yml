name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run checks
        run: composer check

  lint-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify .gitattributes exists
        run: |
          if [ ! -f .gitattributes ]; then
            echo "::error::.gitattributes is missing"
            exit 1
          fi

      - name: Verify .gitattributes has export-ignore rules
        run: |
          if ! grep -q 'export-ignore' .gitattributes; then
            echo "::error::.gitattributes has no export-ignore rules"
            exit 1
          fi

      - name: Verify LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE file is missing"
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: [check, lint-packaging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release